# Template only - create the real Secret out of band (sealed-secrets, external-secrets, or kubectl):
#   kubectl -n devops-portal create secret generic devops-portal-backend \
#     --from-literal=DB_USERNAME=portal --from-literal=DB_PASSWORD=... \
#     --from-literal=GITHUB_OAUTH_CLIENT_ID=... --from-literal=GITHUB_OAUTH_CLIENT_SECRET=... \
#     --from-literal=PORTAL_ENCRYPTION_KEY="$(openssl rand -base64 32)"
apiVersion: v1
kind: Secret
metadata:
  name: devops-portal-backend
type: Opaque
stringData:
  DB_USERNAME: portal
  DB_PASSWORD: change-me
  GITHUB_OAUTH_CLIENT_ID: change-me
  GITHUB_OAUTH_CLIENT_SECRET: change-me
  PORTAL_ENCRYPTION_KEY: change-me-base64-32-bytes
  # Optional env defaults for integrations (UI settings take precedence)
  GITHUB_TOKEN: ""
  AZDO_PAT: ""
  COSMOS_KEY: ""
