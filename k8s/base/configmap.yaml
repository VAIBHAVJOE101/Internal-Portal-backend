apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-portal-backend
data:
  # Runtime switch: mock | h2 | postgres
  PORTAL_PROFILE: "postgres"
  # Backend is served under this path (the frontend nginx proxies /devopsportal/ to this Service)
  PORTAL_CONTEXT_PATH: "/devopsportal"
  PORTAL_ENVIRONMENT: "prod"
  PORTAL_FRONTEND_URL: "/"
  PORTAL_COOKIE_SECURE: "true"
  GITHUB_ORG: "your-org"
  GITHUB_ADMIN_TEAM: "devops_team"
  GITHUB_OAUTH_SCOPES: "read:user,read:org,repo,workflow,admin:org"
  DB_URL: "jdbc:postgresql://postgres.devops-portal.svc:5432/portal"
