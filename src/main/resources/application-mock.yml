# PORTAL_PROFILE=mock: self-contained demo mode. Uses the h2 profile's in-memory database (see the profile group in
# application.yml), mocked integrations and local login users (admin/admin, reader/reader).
portal:
  mode: mock
  environment: demo
  auth:
    github-org: acme-platform
  jobs:
    kafka-health-interval: 30s
    expiry-check-interval: 1h
