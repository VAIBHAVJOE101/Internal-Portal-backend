server:
  port: 8080
  servlet:
    # Every backend URL lives under this prefix: /devopsportal/api, /devopsportal/actuator, /devopsportal/swagger-ui.html ...
    context-path: ${PORTAL_CONTEXT_PATH:/devopsportal}
    session:
      timeout: 8h
      cookie:
        name: PORTAL_SESSION
        http-only: true
        same-site: lax
        secure: ${PORTAL_COOKIE_SECURE:false}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: devops-portal-backend
  profiles:
    # Runtime switch: PORTAL_PROFILE=mock | h2 | postgres (SPRING_PROFILES_ACTIVE works too and takes precedence).
    #   mock     - in-memory H2, mocked Kafka / Azure Boards / GitHub / Cosmos, demo users admin/admin and reader/reader
    #   h2       - embedded H2 database, real integrations and GitHub login
    #   postgres - PostgreSQL database, real integrations and GitHub login (production)
    default: ${PORTAL_PROFILE:postgres}
    group:
      mock: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    placeholders:
      json: TEXT
      blob: BYTEA
  session:
    timeout: 8h
    jdbc:
      initialize-schema: always
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_OAUTH_CLIENT_ID:change-me}
            client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:change-me}
            scope: ${GITHUB_OAUTH_SCOPES:read:user,read:org,repo,workflow,admin:org}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

portal:
  # real = talk to Kafka / Azure DevOps / GitHub / Cosmos; mock = seeded in-memory demo data. Set by the profile.
  mode: real
  environment: ${PORTAL_ENVIRONMENT:dev}
  # Where the browser is sent after login (the SPA at the root of the same host). Not prefixed with the context path.
  frontend-url: ${PORTAL_FRONTEND_URL:/}
  # Absolute URL of the portal, used for links in email / Teams notifications
  public-url: ${PORTAL_PUBLIC_URL:http://localhost:5173}
  # Base64 encoded 256-bit key used to encrypt integration secrets at rest (mount from a K8s Secret)
  encryption-key: ${PORTAL_ENCRYPTION_KEY:}
  auth:
    github-org: ${GITHUB_ORG:}
    admin-team-slug: ${GITHUB_ADMIN_TEAM:devops_team}
  jobs:
    kafka-health-interval: 60s
    expiry-check-interval: 6h
  # Optional env-provided defaults for integration settings. Values saved in the UI take precedence.
  integrations:
    github:
      org: ${GITHUB_ORG:}
      apiUrl: https://api.github.com
      token: ${GITHUB_TOKEN:}
    azure-devops:
      baseUrl: https://dev.azure.com
      organization: ${AZDO_ORG:}
      project: ${AZDO_PROJECT:}
      team: ${AZDO_TEAM:}
      pat: ${AZDO_PAT:}
    cosmos:
      endpoint: ${COSMOS_ENDPOINT:}
      key: ${COSMOS_KEY:}
      database: ${COSMOS_DATABASE:}
      container: ${COSMOS_CONTAINER:}
    email:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      from: ${SMTP_FROM:}
      defaultRecipients: ${ALERT_EMAIL_RECIPIENTS:}
    teams:
      webhookUrl: ${TEAMS_WEBHOOK_URL:}
      escalationWebhookUrl: ${TEAMS_ESCALATION_WEBHOOK_URL:}
